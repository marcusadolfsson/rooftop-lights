version: '3.8'

services:
  rooftop-lights:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
      - "6454:6454/udp"  # ArtNet port
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/rooftop-lights.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    networks:
      - rooftop-network

networks:
  rooftop-network:
    driver: bridge
