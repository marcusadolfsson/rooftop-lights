version: '3.8'

services:
  rooftop-lights:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Shown on the Light Layout page: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "3030:3030"
      - "6454:6454/udp"  # ArtNet port
    volumes:
      - rooftop-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/rooftop-lights.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # Local time zone for schedules (needs tzdata, installed in the image)
      - TZ=${TZ:-America/New_York}
      # Extra allowed CORS origins, comma-separated (default: same-origin only)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    restart: unless-stopped
    networks:
      - rooftop-network

volumes:
  rooftop-data:
    name: rooftop-data
    external: true

networks:
  rooftop-network:
    driver: bridge
