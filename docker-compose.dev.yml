version: '3.8'

services:
  rooftop-lights-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3030:3030"
      - "6454:6454/udp"
    volumes:
      # Hot reload: mount source directories
      - ./backend/src:/app/backend/src
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      # Persistent data
      - rooftop-data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/app/data/rooftop-lights.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # Local time zone for schedules (needs tzdata, installed in the image)
      - TZ=${TZ:-America/New_York}
      # Extra allowed CORS origins, comma-separated (default: same-origin only)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    restart: unless-stopped
    networks:
      - rooftop-network

volumes:
  rooftop-data:
    name: rooftop-data
    external: true

networks:
  rooftop-network:
    driver: bridge
