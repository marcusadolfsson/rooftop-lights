<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooftop Lights Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Auto-reload when page goes blank (e.g. after container restart)
      ;(function() {
        var checks = 0;
        setInterval(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            checks++;
            if (checks > 3) { window.location.reload(); }
          } else {
            checks = 0;
          }
        }, 2000);
      })();
    </script>
  </body>
</html>
